{% extends 'interna/base.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'interna/css/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="inventario formulario-contenedor">

    <header class="inventario-cabecera">
        <div>
            <h1>Cerrar sesión</h1>
            <p>Confirma si deseas salir del sistema.</p>
        </div>
    </header>

    <section class="inventario-panel">
        <h2>
            <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            ¿Estás seguro de cerrar sesión?
        </h2>

        <p>Para volver a ingresar tendrás que iniciar sesión nuevamente.</p>

        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}

            <div class="formulario-acciones">
                <button type="button"
                        class="formulario-boton formulario-boton-secundario"
                        onclick="window.history.back()">
                    Cancelar
                </button>

                <button type="submit" class="formulario-boton">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
                    Sí, cerrar sesión
                </button>
            </div>
        </form>
    </section>

</main>
{% endblock %}
