{% extends 'interna/base.html' %}

{% block content %}
<h1>Lista de usuarios</h1>
<a href="{% url 'usuario-create' %}">Crear Nuevo Usuario</a>

<ul>
    {% for usuario in usuarios %}
    <li>
        {{ usuario.user.username }} - {{ usuario.rol }}
        <a href="{% url 'usuario-update' usuario.pk %}">Editar</a>
        <a href="{% url 'usuario-delete' usuario.pk %}">Eliminar</a>
    </li>
    {% empty %}
    <li>No hay usuarios registrados</li>
    {% endfor %}
</ul>
{% endblock %}
